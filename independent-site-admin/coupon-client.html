<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOPLAY · 商品与履约演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#f6f6f8;font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header,main{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d2f39}.brand{font-size:23px;font-weight:800;letter-spacing:.08em}.nav{display:flex;gap:12px;align-items:center}a{color:#a9b8ff}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #4d4f5b;border-radius:7px;background:#26272d;color:#f7f7fa;padding:10px 16px}button.primary{background:#e9e9eb;color:#171719;border-color:#e9e9eb;font-weight:700}button.link{border:0;background:transparent;color:#b5c2ff;padding:0}button:disabled{opacity:.45;cursor:not-allowed}h1{font-size:32px;margin:18px 0 4px}h2{font-size:23px;margin:0 0 16px}h3{font-size:18px;margin:8px 0}p{color:#b6b7c0;margin:8px 0 18px}.muted,.note{color:#a4a6b0;font-size:13px}.toolbar{display:flex;gap:12px;margin:24px 0}.toolbar input{flex:1}.toolbar input,.form input,.form select{border:1px solid #4c4e59;border-radius:7px;background:#22232a;color:white;padding:11px;min-width:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#1d1e24;border:1px solid #30313b;border-radius:12px;padding:19px;min-height:242px;display:flex;flex-direction:column}.art{height:88px;border-radius:8px;background:linear-gradient(120deg,#252f54,#493657 56%,#76522e);margin-bottom:14px}.card.recharge .art{background:linear-gradient(120deg,#153f61,#275a72 56%,#386655)}.card h3{margin:0}.card .grow{flex:1}.price{color:#fff;font-size:24px;font-weight:750}.old{color:#8c8d96;text-decoration:line-through;font-size:13px;margin-left:8px}.promo{color:#ffbb7b;font-size:13px;margin:2px 0 12px}.pill{display:inline-block;border-radius:99px;background:#263d37;color:#9ee0c5;padding:2px 9px;font-size:12px}.pill.wait{background:#443d2c;color:#f1d297;padding:2px 9px}.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#c3c4cc}.form .check{display:flex;align-items:flex-start;gap:9px}.form .check input{margin-top:5px}.summary{background:#26272d;border-radius:9px;padding:16px;margin:18px 0}.summary strong{color:#fff}.row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #373840}.row:last-child{border:0}.row span:first-child{color:#aaaeb9}.notice{background:#242b37;border-left:3px solid #8eafff;padding:11px 13px;color:#c8d6f7;margin:14px 0}.error{color:#ff9c9c;min-height:24px}dialog{width:min(530px,calc(100vw - 28px));max-height:90vh;overflow:auto;background:#1e1f24;color:#fff;border:1px solid #4a4b54;border-radius:10px;padding:25px}dialog::backdrop{background:#000b}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.coupon{background:#ececff;color:#25264a;padding:18px;border-radius:8px;margin:14px 0}.coupon strong{font-size:26px}.coupon p{color:#505272}.eyebrow{font-size:12px;color:#bfc2cc;letter-spacing:.1em;text-transform:uppercase}.topnote{display:flex;justify-content:space-between;gap:20px;align-items:center}.orderlist{display:grid;gap:8px;margin:16px 0}.orderlink{width:100%;text-align:left;display:flex;justify-content:space-between}.empty{padding:35px;border:1px dashed #484a56;border-radius:9px;text-align:center;color:#aaa}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){header,main{padding:16px}.grid{grid-template-columns:1fr}.topnote{display:block}.nav{gap:7px}dialog{padding:18px}}
</style>
</head>
<body>
<header><div class="brand">YOPLAY</div><div class="nav"><button id="ordersButton">我的订单</button><button id="loginButton">登录</button><a href="index.html#/marketing/couponGrants">管理后台</a></div></header>
<main><div class="topnote"><div><span class="eyebrow">V1.2.4 交互原型</span><h1>探索你的下一场游戏</h1><p>进入商品详情后领取适用优惠券；接口充值商品在支付后查询到账结果。</p></div><span class="note">本地虚构数据 · 不连接真实支付与雷神接口</span></div><form class="toolbar" id="search"><input id="keyword" aria-label="商品搜索" placeholder="搜索商品／输入演示口令 YOPLAY8 或 WELCOME10"><button class="primary">搜索</button></form><div id="message" role="status" aria-live="polite"></div><div id="products" class="grid"></div></main>
<dialog id="loginDialog"><h2>登录 YOPLAY</h2><p>选择演示账号，进入商详后将自动校验发券资格。</p><select id="account" aria-label="演示账号"></select><div class="foot"><button id="cancelLogin">取消</button><button id="confirmLogin" class="primary">登录并继续</button></div></dialog>
<dialog id="detailDialog"><div id="detailContent"></div><div class="foot"><button id="closeDetail">继续逛逛</button><button id="buyButton" class="primary">立即购买</button></div></dialog>
<dialog id="confirmDialog"><div id="confirmContent"></div><p id="confirmError" class="error" role="alert"></p><div class="foot"><button id="closeConfirm">取消</button><button id="payButton" class="primary">演示支付完成</button></div></dialog>
<dialog id="paymentDialog"><div id="paymentContent"></div><div class="foot"><button id="closePayment">继续逛逛</button><button id="paymentOrderButton" class="primary">查看订单</button></div></dialog>
<dialog id="ordersDialog"><h2>我的订单</h2><div id="ordersContent"></div><div class="foot"><button id="closeOrders">关闭</button></div></dialog>
<dialog id="orderDialog"><div id="orderContent"></div><div class="foot"><button id="closeOrder">关闭</button><button id="completeOrder" class="primary" hidden>演示确认到账</button></div></dialog>
<dialog id="reward"><h2>优惠券已到账</h2><div class="coupon"><strong id="rewardValue"></strong><p id="rewardName"></p><p id="rewardValidity"></p></div><div class="foot"><button id="closeReward" class="primary">知道了</button></div></dialog>

</body></html>
